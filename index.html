<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>My Pure GenAI</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 15px; padding: 10px 15px; border-radius: 8px; max-width: 70%; line-height: 1.5; }
        .user { background: #007bff; margin-left: auto; }
        .assistant { background: #2a2a2a; border: 1px solid #333; }
        #input-area { display: flex; padding: 15px; background: #1e1e1e; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: 1px solid #444; background: #2b2b2b; color: #fff; }
        button { padding: 12px 20px; margin-left: 10px; border: none; background: #007bff; color: #fff; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-window"></div>
<div id="input-area">
    <input type="text" id="user-input" placeholder="메시지를 입력하세요..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">전송</button>
</div>

<script>
    const chatHistory = [{"role": "system", "content": "너는 친절하고 인공지능 생성형 대화 도우미야."}];

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    async function sendMessage() {
        const inputEl = document.getElementById('user-input');
        const text = inputEl.value.trim();
        if (!text) return;

        appendMessage('user', text);
        chatHistory.push({"role": "user", "content": text});
        inputEl.value = '';

        const loadingEl = appendMessage('assistant', '생성 중...');

        try {
            const res = await fetch('https://my-ai-backend-2kqk.onrender.com/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: text })
            });
            
            const data = await res.json();
            const replyText = data.response || "응답을 받지 못했습니다.";
            
            loadingEl.innerText = replyText;
            chatHistory.push({"role": "assistant", "content": replyText});
        } catch (err) {
            loadingEl.innerText = "오류가 발생했습니다.";
        }
    }

    function appendMessage(role, text) {
        const win = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerText = text;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
        return div;
    }
</script>

</body>
</html>
