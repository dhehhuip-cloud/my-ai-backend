<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        #chat-box { border: 1px solid #ccc; height: 350px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .user-msg { text-align: right; color: blue; margin: 5px 0; }
        .ai-msg { text-align: left; color: green; margin: 5px 0; }
        .controls { margin-bottom: 10px; display: flex; gap: 8px; }
        .mode-btn { padding: 6px 12px; border: 1px solid #007bff; background: white; color: #007bff; border-radius: 4px; cursor: pointer; }
        .mode-btn.active { background: #007bff; color: white; }
        .reset-btn { padding: 6px 12px; border: 1px solid #dc3545; background: white; color: #dc3545; border-radius: 4px; cursor: pointer; margin-left: auto; }
        .input-box { display: flex; gap: 5px; }
        input[type="text"] { flex: 1; padding: 8px; }
        button.send-btn { padding: 8px 15px; }
    </style>
</head>
<body>
    <h2>🤖 AI Chatbot</h2>
    
    <!-- 컨트롤 영역 (모드 선택 및 새 대화 시작) -->
    <div class="controls">
        <button id="btn-normal" class="mode-btn active" onclick="setMode('normal')">일반 모드</button>
        <button id="btn-concise" class="mode-btn" onclick="setMode('concise')">간결하게 말하는 모드</button>
        <button class="reset-btn" onclick="resetChat()">새 대화 시작</button>
    </div>

    <div id="chat-box"></div>

    <div class="input-box">
        <input type="text" id="userInput" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">전송</button>
    </div>

    <script>
        const BACKEND_URL = "https://my-ai-backend-2kqk.onrender.com"; // 본인의 Render 백엔드 주소
        let currentMode = "normal";

        function setMode(mode) {
            currentMode = mode;
            document.getElementById("btn-normal").classList.toggle("active", mode === "normal");
            document.getElementById("btn-concise").classList.toggle("active", mode === "concise");
        }

        function resetChat() {
            document.getElementById("chat-box").innerHTML = "";
            alert("대화가 초기화되었습니다.");
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<div class="user-msg"><b>나:</b> ${text}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`${BACKEND_URL}/api/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: text, mode: currentMode })
                });
                const data = await response.json();
                chatBox.innerHTML += `<div class="ai-msg"><b>AI:</b> ${data.response}</div>`;
            } catch (err) {
                chatBox.innerHTML += `<div class="ai-msg" style="color:red;"><b>오류:</b> 서버 통신 실패</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
